name: Business Operations Harness CI

on:
  push:
    branches:
      - main
      - "feat/business-operations-harness-v1"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/automation-harness-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run harness tests
        run: npm test
      - name: Run reference workflow
        run: npm run demo
